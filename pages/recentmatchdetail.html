<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recent Match</title>
  <meta name="description" content=""/>
  <link rel="canonical" href="https://theexactmatch.com/recent-matches/"/>
  <meta property="og:title" content=""/>
  <meta property="og:description" content=""/>
  <meta property="og:url" content=""/>
  <meta property="og:image" content="https://theexactmatch.com/og-image.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preconnect" href="https://api.fontshare.com"/>
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin/>
  <!-- Font stylesheets loaded non-blocking (preload + swap-on-load, with a
       <noscript> fallback for the no-JS/crawler case) — a <link
       rel="stylesheet"> to a third-party host otherwise blocks first paint
       on that host's round trip regardless of font-display, since the
       browser can't know in advance the fetched CSS only affects
       @font-face. site.css stays a normal blocking stylesheet: it's
       same-origin, small, and needed immediately for layout. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap"/></noscript>
  <link rel="preload" as="style" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800&f[]=general-sans@400,500,600,700&display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
  <noscript><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800&f[]=general-sans@400,500,600,700&display=swap"/></noscript>
  <link rel="stylesheet" href="/css/site.css"/>
</head>
<body>

<div id="nl-slot"></div>
<div id="nav-slot"></div>
<div id="mobile-menu-slot"></div>

<!-- One shared template — see pages/city.html for the same
     one-file-many-URLs pattern. Every #rmd-* placeholder is filled
     server-side per request from live dealer-api data (src/index.js). -->
<div class="page" id="page-recent-match-detail">
  <div class="home-wrap">
    <section class="home-section" style="padding-top:96px">
      <div class="home-section-head">
        <h2>The Deal</h2>
        <a class="home-text-cta" href="/recent-matches">&larr; All Matches</a>
      </div>
      <div class="home-featured">
        <div class="home-photo-block" id="rmd-photo-wrap" style="aspect-ratio:4/3"></div>
        <div class="home-featured-info">
          <h1 id="rmd-heading" style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;color:var(--home-navy);margin:0 0 4px"></h1>
          <div class="rm-vehicle" id="rmd-vehicle" style="margin-bottom:20px"></div>
          <div class="rm-saved" id="rmd-saved"></div>
          <div class="rm-tags" id="rmd-tags"></div>
          <a class="home-text-cta" href="/find-my-car">Start your own search — free &rarr;</a>
        </div>
      </div>
    </section>
  </div>

  <div class="home-footer-cta">
    <div class="home-wrap">
      <h2>Ready to start your match?</h2>
      <a class="home-ticket" href="/find-my-car"><span>Start a free search</span></a>
    </div>
  </div>

  <div id="footer-slot"></div>
</div>

<script src="/js/site.js"></script>
</body>
</html>
